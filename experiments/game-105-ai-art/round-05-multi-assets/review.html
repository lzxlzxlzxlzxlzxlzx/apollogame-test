<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背景单项比较 · 未批准</title><style>body{margin:16px;background:#eee4dd;color:#382b36;font:16px system-ui}button,select{font:inherit;padding:9px 14px;margin:4px}button[aria-pressed=true]{background:#603c51;color:white}iframe{display:block;border:0;margin-top:12px}p{margin:8px 0}</style><h1>game105 背景单项比较</h1><p>只切换背景，不重开游戏。原人物、桌面、积木和全部控件保持正式版本。</p><nav><button data-bg="baseline" aria-pressed="true">正式基线</button><button data-bg="A">A 绘本夜景</button><button data-bg="B">B 安静房间</button><button data-bg="C">C 柔和现代</button><select id="size"><option>1280×720</option><option>1024×576</option><option>800×450</option><option>667×375</option><option>390×844</option></select><span id="status">加载中</span></nav><p>这是实验比较页。选择尺寸改变测试视口，沿用游戏原有响应式规则。评审结论请填写人工评价表。</p><iframe id="game-frame" src="./index.html" width="1280" height="720"></iframe><script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split('×');frame.width=w;frame.height=h};
for(const button of document.querySelectorAll('[data-bg]'))button.onclick=async()=>{try{const lab=frame.contentWindow.__bgLab;if(!lab)throw new Error('游戏仍在加载');await lab.set(button.dataset.bg);for(const b of document.querySelectorAll('[data-bg]'))b.setAttribute('aria-pressed',String(b===button));status.textContent=`当前：${button.textContent}`}catch(e){status.textContent=String(e)}};
frame.onload=()=>{status.textContent='正式基线；图片加载完成后可切换'};
</script></html>
