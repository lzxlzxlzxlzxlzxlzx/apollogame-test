<svg xmlns="http://www.w3.org/2000/svg" width="150" height="218" viewBox="0 0 150 218">
  <defs>
    <radialGradient id="paper" cx="50%" cy="0%" r="108%" fx="50%" fy="0%">
      <stop offset="0" stop-color="#eee1c2"/>
      <stop offset="1" stop-color="#c8b48e"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#685944" stop-opacity=".15"/>
      <stop offset="1" stop-color="#685944" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-12%" y="-10%" width="124%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".53"/>
    </filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#73552b" flood-opacity=".33" result="shade"/>
      <feComposite in="shade" in2="SourceAlpha" operator="in" result="mask"/>
      <feGaussianBlur in="mask" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="inner"/>
      <feComposite in="SourceGraphic" in2="inner" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#card-shadow)">
    <rect x="5" y="5" width="140" height="203" rx="5" fill="url(#paper)"/>
    <rect x="5" y="5" width="140" height="203" rx="5" fill="url(#paper)" filter="url(#inset)"/>
    <rect x="6.5" y="6.5" width="137" height="200" rx="3.5" fill="none" stroke="#8f6b35"/>
    <rect x="9.5" y="9.5" width="131" height="194" rx="1.5" fill="none" stroke="#8f6b35"/>
    <rect x="14" y="14" width="122" height="61" fill="url(#well)"/>
    <path d="M14 75.5H136" fill="none" stroke="#8d724b"/>
    <circle cx="19.5" cy="19.5" r="11.5" fill="#322a1b" stroke="#bd9a5b"/>
  </g>
</svg>
