<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAL Template · UI Prototype v0</title>
  <style>
    :root { color-scheme: dark; --ink:#160f27; --paper:#fbf5ec; --violet:#8d69d6; --gold:#eabf70; --mist:#d9c9ff; --line:rgba(255,255,255,.28); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1440px; min-height:900px; overflow:hidden; background:#0d0917; color:var(--paper); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
    button { color:inherit; font:inherit; cursor:pointer; }
    .stage { position:relative; width:1440px; height:900px; margin:auto; overflow:hidden; background:radial-gradient(circle at 72% 15%,#7755b1 0 2%,transparent 12%),linear-gradient(145deg,#151027 0%,#27204b 52%,#091c35 100%); }
    .stars,.stars::before,.stars::after { position:absolute; inset:0; content:""; pointer-events:none; background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#d9c9ff 1px,transparent 1.4px); background-size:67px 67px,109px 109px; background-position:4px 13px,31px 48px; opacity:.6; }
    .stars::before { transform:translateX(23px); opacity:.32; } .stars::after { transform:translateY(37px); opacity:.23; }
    .moon { position:absolute; right:150px; top:78px; width:166px; height:166px; border-radius:50%; background:#fff3d2; box-shadow:0 0 40px 14px rgba(255,238,190,.28),0 0 120px 40px rgba(155,117,255,.15); }
    .moon::after { content:""; position:absolute; inset:18px 17px auto auto; width:35px; height:35px; border-radius:50%; background:#eee0bd; opacity:.55; }
    .ridge { position:absolute; inset:auto -80px 195px; height:270px; opacity:.82; background:linear-gradient(168deg,transparent 0 35%,#101529 35.2% 47%,transparent 47.2%),linear-gradient(12deg,transparent 0 39%,#172844 39.2% 57%,transparent 57.2%),linear-gradient(170deg,transparent 0 56%,#0d1729 56.2%); }
    .header { position:absolute; z-index:4; top:0; inset-inline:0; height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 38px; background:linear-gradient(to bottom,rgba(10,7,18,.72),transparent); }
    .brand { font-family:Georgia,"Noto Serif SC",serif; letter-spacing:.18em; font-size:15px; color:#fff1c5; text-shadow:0 1px 7px #000; }
    .tools { display:flex; gap:8px; } .tool { border:1px solid transparent; border-radius:16px; padding:7px 12px; background:rgba(18,12,32,.36); font-size:12px; color:#f5ecff; }
    .tool:hover,.tool.active { border-color:rgba(235,197,112,.7); background:rgba(73,48,103,.8); }
    .character { position:absolute; z-index:2; right:165px; bottom:120px; width:342px; height:575px; filter:drop-shadow(0 20px 21px rgba(0,0,0,.55)); }
    .character .halo { position:absolute; left:20px; top:60px; width:288px; height:288px; border:1px solid rgba(235,196,126,.55); border-radius:50%; box-shadow:0 0 45px rgba(196,155,255,.35); }
    .character .silhouette { position:absolute; bottom:0; left:73px; width:214px; height:490px; border-radius:48% 48% 18% 18% / 25% 25% 4% 4%; background:linear-gradient(120deg,#cab5e7,#684d91 48%,#251d48); clip-path:polygon(37% 0,66% 0,79% 17%,85% 37%,96% 62%,85% 100%,10% 100%,1% 65%,15% 37%,21% 17%); }
    .character .tag { position:absolute; top:12px; left:0; width:162px; padding:8px; border:1px dashed rgba(255,255,255,.7); color:#fff; text-align:center; font-size:12px; background:rgba(20,13,37,.8); }
    .dialogue { position:absolute; z-index:5; left:83px; right:83px; bottom:42px; min-height:178px; padding:26px 44px 30px; border:1px solid rgba(255,239,194,.76); border-radius:5px 5px 24px 5px; background:linear-gradient(125deg,rgba(21,12,35,.94),rgba(42,29,65,.91)); box-shadow:0 13px 35px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.04); }
    .dialogue::before { content:""; position:absolute; left:0; top:0; width:180px; height:3px; background:linear-gradient(90deg,var(--gold),transparent); }
    .speaker { display:inline-block; margin-top:-51px; padding:10px 26px; border:1px solid rgba(255,239,194,.86); background:#30204e; color:#ffe7a5; font-family:Georgia,"Noto Serif SC",serif; letter-spacing:.14em; }
    .text { margin:17px 8px 0; max-width:955px; font-size:23px; line-height:1.8; letter-spacing:.04em; text-shadow:0 2px 3px #000; }
    .hint { position:absolute; right:35px; bottom:19px; color:#e5d7ff; font-size:12px; opacity:.9; } .caret { display:inline-block; margin-left:9px; color:var(--gold); animation:blink 1.1s infinite; } @keyframes blink { 50% { opacity:0; } }
    .choice { position:absolute; z-index:6; left:50%; top:42%; width:480px; transform:translate(-50%,-50%); display:none; padding:18px; border:1px solid rgba(255,239,194,.78); background:rgba(24,15,42,.94); box-shadow:0 18px 55px rgba(0,0,0,.45); }
    .choice.show { display:block; } .choice h2 { margin:0 0 15px; font-family:Georgia,"Noto Serif SC",serif; font-size:17px; color:#ffe5a3; text-align:center; }
    .choice button { display:block; width:100%; margin:9px 0; padding:14px 18px; border:1px solid rgba(226,204,255,.35); background:linear-gradient(105deg,#30214f,#49336b); text-align:left; } .choice button:hover { border-color:var(--gold); transform:translateX(6px); }
    .panel { position:absolute; z-index:10; inset:82px 116px 80px; display:none; overflow:auto; padding:38px 46px; border:1px solid rgba(255,239,194,.73); background:linear-gradient(130deg,rgba(18,12,32,.97),rgba(43,31,63,.97)); box-shadow:0 25px 80px rgba(0,0,0,.55); }
    .panel.show { display:block; } .panel h1 { margin:0 0 27px; color:#ffe6aa; font-family:Georgia,"Noto Serif SC",serif; font-weight:normal; letter-spacing:.18em; font-size:28px; } .close { position:absolute; right:24px; top:22px; border:0; background:none; color:#fff; font-size:20px; }
    .slots { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }.slot { min-height:110px; padding:16px; border:1px solid rgba(255,255,255,.23); background:rgba(255,255,255,.045); }.slot:hover { border-color:var(--gold); }.slot b { color:#ffe5a3; }.thumb { float:right; width:112px; height:72px; margin-left:14px; background:linear-gradient(145deg,#413b78,#98a5dc 60%,#f0c4ae); border:1px solid rgba(255,255,255,.35); }.slot small { display:block; margin-top:8px; color:#d9ceef; }
    .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }.cg { height:170px; border:1px solid rgba(255,255,255,.25); background:linear-gradient(135deg,#76558d,#202d55 50%,#d69f95); display:grid; place-items:center; color:#fff; }.cg.locked { filter:grayscale(1) brightness(.35); }.setting { display:flex; justify-content:space-between; align-items:center; padding:17px 0; border-bottom:1px solid rgba(255,255,255,.14); }.switch { width:48px; height:25px; border-radius:20px; border:0; background:#5b4680; }.switch::after { content:""; display:block; width:19px; height:19px; margin-left:25px; border-radius:50%; background:#fff0bf; }
    .history-line { padding:15px 5px; border-bottom:1px solid rgba(255,255,255,.14); line-height:1.7; }.history-line b { display:block; color:#ffe4a2; }.history-line.current { background:rgba(169,125,235,.12); }
    .title { position:absolute; z-index:8; inset:0; display:none; place-items:center; background:radial-gradient(circle at 50% 43%,rgba(124,88,184,.28),rgba(8,6,17,.88) 58%),rgba(4,3,11,.72); }.title.show { display:grid; }.stage:has(.title.show) .dialogue,.stage:has(.title.show) .character,.stage:has(.title.show) .header .tools { visibility:hidden; }.title-card { text-align:center; }.title-card h1 { margin:0; font-family:Georgia,"Noto Serif SC",serif; font-size:72px; font-weight:normal; letter-spacing:.18em; color:#fff2c7; text-shadow:0 4px 18px #000; }.title-card p { margin:18px 0 38px; letter-spacing:.32em; }.title-card button { display:block; width:300px; margin:9px auto; padding:13px; border:1px solid rgba(255,239,194,.52); background:rgba(30,19,48,.65); letter-spacing:.18em; }.title-card button:hover { background:#72519a; border-color:#fff0bd; }
    .proto-nav { position:absolute; z-index:20; top:80px; left:18px; width:112px; display:flex; flex-direction:column; gap:5px; opacity:.7; }.proto-nav:hover { opacity:1; }.proto-nav button { padding:7px; border:1px solid #a995d4; background:#1b1430; font-size:11px; }
    .toast { position:absolute; z-index:30; top:82px; left:50%; transform:translateX(-50%); padding:9px 16px; border:1px solid var(--gold); background:#211637; color:#fff1c4; opacity:0; transition:opacity .2s; font-size:13px; }.toast.show { opacity:1; }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="stars"></div><div class="moon"></div><div class="ridge"></div>
    <header class="header"><div class="brand">GAL TEMPLATE / PROTOTYPE V0</div><nav class="tools"><button class="tool" data-panel="history">历史</button><button class="tool" data-panel="save">保存</button><button class="tool" data-panel="load">读取</button><button class="tool" data-panel="settings">设置</button></nav></header>
    <aside class="proto-nav" aria-label="原型预览导航"><button data-screen="title">标题</button><button data-screen="story">对话</button><button data-screen="choice">分支</button><button data-panel="save">存读档</button><button data-panel="gallery">回想 CG</button><button data-panel="settings">设置</button></aside>
    <section class="character"><div class="halo"></div><div class="silhouette"></div><div class="tag">角色立绘占位<br>emotion: calm</div></section>
    <section class="dialogue" id="dialogue"><div class="speaker" id="speaker">星见 澪</div><p class="text" id="line">月亮升起来的时候，旧校舍的窗户会映出不属于任何人的灯火。</p><span class="hint">滚轮↑ 回退一句　滚轮↓ 下一句 <i class="caret">◆</i></span></section>
    <section class="choice" id="choice"><h2>她静静地望向你。</h2><button data-pick="去旧校舍">去旧校舍</button><button data-pick="先送她回家">先送她回家</button></section>
    <section class="title" id="title"><div class="title-card"><h1>月夜的书页</h1><p>通用 GAL 模板 · 视觉占位稿</p><button data-screen="story">开始游戏</button><button data-panel="load">继续游戏</button><button data-panel="gallery">回想</button><button data-panel="settings">设置</button></div></section>
    <div class="toast" id="toast"></div>
  </main>
  <template id="panelTemplate"><section class="panel"><button class="close" aria-label="关闭">×</button><div class="panel-content"></div></section></template>
  <script>
    const lines=[
      ['星见 澪','月亮升起来的时候，旧校舍的窗户会映出不属于任何人的灯火。'],
      ['我','那盏灯，今晚也会亮起来吗？'],
      ['星见 澪','如果你愿意和我一起去确认，也许我们就能知道答案。'],
      ['旁白','风从樱树的缝隙穿过，带来一点未曾说出口的期待。'],
      ['星见 澪','那么，我们一起走吧。']
    ]; let cursor=0; let panel;
    const toast=m=>{const e=document.querySelector('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900)};
    function renderLine(){const [name,text]=lines[cursor];document.querySelector('#speaker').textContent=name;document.querySelector('#line').textContent=text;}
    function closeAll(){document.querySelector('#choice').classList.remove('show');document.querySelector('#title').classList.remove('show');if(panel){panel.remove();panel=null;}}
    function showPanel(kind){closeAll(); const t=document.querySelector('#panelTemplate').content.cloneNode(true);panel=t.querySelector('.panel');const c=panel.querySelector('.panel-content'); const content={
      history:`<h1>历史回看</h1>${lines.map((x,i)=>`<div class="history-line ${i===cursor?'current':''}"><b>${x[0]}</b>${x[1]}</div>`).join('')}`,
      save:`<h1>保存</h1><div class="slots">${[1,2,3,4,5,6].map((n,i)=>`<article class="slot"><div class="thumb"></div><b>Slot ${String(n).padStart(2,'0')}</b><small>${i===0?'第二章 · 月光下的约定':'空存档位'}</small><small>${i===0?'00:18:42 · 星见 澪':'点击此处保存'}</small></article>`).join('')}</div>`,
      load:`<h1>读取</h1><div class="slots"><article class="slot"><div class="thumb"></div><b>Slot 01</b><small>第二章 · 月光下的约定</small><small>00:18:42 · 星见 澪</small></article>${[2,3,4,5,6].map(n=>`<article class="slot"><b>Slot ${String(n).padStart(2,'0')}</b><small>空存档位</small></article>`).join('')}</div>`,
      gallery:`<h1>CG 回想</h1><div class="gallery"><div class="cg">CG 01 · 月下初见</div><div class="cg locked">未解锁</div><div class="cg locked">未解锁</div><div class="cg locked">未解锁</div><div class="cg locked">未解锁</div><div class="cg locked">未解锁</div></div>`,
      settings:`<h1>设置</h1><div class="setting"><span>文字显示速度</span><b>标准　　＋</b></div><div class="setting"><span>自动播放间隔</span><b>1.2 秒　＋</b></div><div class="setting"><span>已读文本跳过</span><button class="switch" aria-label="已开启"></button></div><div class="setting"><span>滚轮逐句回退与前进</span><button class="switch" aria-label="已开启"></button></div><div class="setting"><span>背景音乐音量</span><b>━━━━━━●━━</b></div>`
    }; c.innerHTML=content[kind];document.querySelector('#stage').append(panel);panel.querySelector('.close').onclick=()=>{panel.remove();panel=null};}
    document.addEventListener('click',e=>{const panelName=e.target.dataset.panel,screen=e.target.dataset.screen;if(panelName)showPanel(panelName);if(screen){closeAll();if(screen==='title')document.querySelector('#title').classList.add('show');if(screen==='choice')document.querySelector('#choice').classList.add('show');}if(e.target.dataset.pick){lines[4]=e.target.dataset.pick==='去旧校舍'?['星见 澪','那么，我们一起去旧校舍吧。']:['星见 澪','谢谢你。今晚，我们先回家。'];cursor=4;renderLine();document.querySelector('#choice').classList.remove('show');toast(`已选择：「${e.target.dataset.pick}」`);}});
    document.querySelector('#stage').addEventListener('wheel',e=>{e.preventDefault();if(panel||document.querySelector('#title').classList.contains('show'))return;const choice=document.querySelector('#choice');if(e.deltaY<0){if(choice.classList.contains('show')){choice.classList.remove('show');cursor=2;}else if(cursor>0)cursor--;renderLine();if(cursor===3)choice.classList.add('show');toast(cursor===3?'已回到选择点，可重新选择':'回退一句：演出状态重建');}else{if(choice.classList.contains('show'))return;if(cursor===3){choice.classList.add('show');toast('请选择分支');}else if(cursor<lines.length-1){cursor++;renderLine();if(cursor===3)choice.classList.add('show');toast('推进一句');}else toast('已到达本段终点');}},{passive:false});
    document.querySelector('#title').classList.add('show');renderLine();
  </script>
</body>
</html>
