    .flash{animation:flash .6s ease-out}.rise{animation:rise 1.35s ease-out}#effect-word{position:absolute;left:530px;top:175px;width:470px;text-align:center;font:700 27px Georgia,"Microsoft YaHei",serif;color:#fff0ae;text-shadow:0 3px 14px #000;z-index:9;opacity:0;pointer-events:none}#effect-word.show{animation:word .65s ease-out}#stage.motion-off *,#stage.motion-off *:before,#stage.motion-off *:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

<body>
<div id="viewport"><main id="stage" aria-label="坩埚炼药设计原型">
  <header class="mast"><div class="eyebrow">THE ALCHEMIST'S TABLE · DESIGN PROTOTYPE</div><h1>坩 埚 炼 药</h1><small id="stage-sub">公开配方 · 遵循顺序 · 亲手调制</small></header>
  <section id="scroll" aria-label="公开配方卷轴"><div class="scroll-roller top"></div><div class="section-label">OPEN RECIPE · 公开配方</div><h2 class="scroll-title" id="recipe-name"></h2><div class="scroll-desc" id="recipe-desc"></div><div class="rule"></div><div class="section-label">BREWING STEPS · 完整步骤</div><div class="step-list" id="step-list"></div><div class="scroll-foot">遵循卷轴顺序 · 明确错误会使本次炼制失败</div><div class="scroll-roller bottom"></div></section>
  <section id="bench" aria-label="炼药台"><button id="pot-hit" type="button" aria-label="坩埚：确认投入选中的材料" aria-disabled="false"><span class="rim"></span><span class="liquid"></span><span class="bubbles" id="bubbles"></span><span class="pot-symbol" id="pot-symbol">✦</span></button><div id="direction-trace"><span class="arrow" id="trace-arrow">↻</span></div><div id="hit-overlay" class="hit-overlay"></div><div id="rod" tabindex="0" aria-label="搅拌棒；拖动沿锅口转圈，键盘 Q 逆时针、E 顺时针各搅拌一圈"><div class="rod-shaft"></div><div class="rod-head"></div></div><div id="water-cover" aria-hidden="true"></div><div id="pot-front" aria-hidden="true"></div><div class="status-banner" aria-live="polite"><b id="status-main"></b><small id="status-sub"></small></div></section>
  <aside id="shelf" aria-label="材料架"><div class="shelf-title">✦　材料架　✦</div><div class="shelf-sub">原创原型占位美术 · 拾取材料投入内圈</div><div class="shelf-row" id="shelf-items"></div></aside>
  <div id="effect-word"></div>
  <div id="ghost" aria-hidden="true"></div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card" id="modal-card"><div class="seal" id="modal-seal"></div><h2 id="modal-title"></h2><div class="result-art" id="result-art"><img id="result-image" src="ui-refs/potion-bottle-v1.png" alt="炼制出的药剂瓶原型占位图"><div class="result-caption">成果图片原型占位 · 正式版由 DokiWorld 传入</div></div><p id="modal-text"></p><div class="modal-actions" id="modal-actions"></div></div></div>
  <button id="review-toggle" type="button" aria-expanded="false" aria-hidden="true" tabindex="-1">原型控制 ◇</button><aside id="review" aria-label="原型审阅控制"><h3>原型控制 · 仅供审阅（F2 开关）</h3><div class="control-grid"><button class="control-btn" id="ctrl-switch" type="button">切换宿主样例</button><button class="control-btn" id="ctrl-reset" type="button">重置当前</button><button class="control-btn" id="ctrl-auto-success" type="button">自动成功链</button><button class="control-btn" id="ctrl-auto-wrong" type="button">错误材料链</button><button class="control-btn" id="ctrl-auto-reverse" type="button">反向搅拌链</button></div><label for="ctrl-state">直接切换状态</label><select id="ctrl-state"><option value="">选择状态…</option><option value="bench-idle">炼药台待机</option><option value="ingredient-hover">材料悬停/聚焦</option><option value="ingredient-drag">材料拿起</option><option value="ingredient-snapback">锅外回弹</option><option value="ingredient-correct">正确投料</option><option value="ingredient-wrong">错误投料</option><option value="stir-ready">搅拌待机</option><option value="stir-valid">有效圈</option><option value="stir-invalid">无效轨迹</option><option value="stir-wrong-direction">反向失败</option><option value="success">成功</option><option value="failure">失败</option><option value="exit-confirm">退出确认</option><option value="disabled">禁用态</option></select><div class="toggles"><label><input id="ctrl-hit" type="checkbox"> 命中区域</label><label><input id="ctrl-motion" type="checkbox"> reduced-motion</label></div></aside>
</main></div>
<script>

  async function auto(kind){start();const epoch=state.epoch;const r=recipes[state.recipe];for(let i=0;i<r.steps.length;i++){if(epoch!==state.epoch)return;const s=r.steps[i];if(kind==='wrong'&&i===Math.min(2,r.steps.length-1)){await submitIngredient(s.kind==='add'?(s.ingredientId==='red'?'moon':'red'):'red');return}if(kind==='reverse'&&s.kind==='stir'){await submitTurn(s.direction==='clockwise'?'counterclockwise':'clockwise');return}if(s.kind==='add')await submitIngredient(s.ingredientId);else for(let j=0;j<s.turns;j++)await submitTurn(s.direction);await wait(120)} }
  $('ctrl-auto-success').addEventListener('click',()=>auto('success'));$('ctrl-auto-wrong').addEventListener('click',()=>auto('wrong'));$('ctrl-auto-reverse').addEventListener('click',()=>auto('reverse'));
  function reviewState(name){if(!name)return;start();const r=recipes[state.recipe];if(name==='ingredient-hover'){document.querySelector('.ingredient')?.focus();announce('材料悬停 / 聚焦','材料图形、名称与份数可读')}else if(name==='ingredient-drag'){const g=$('ghost');g.innerHTML=icons.moon;g.style.left='1030px';g.style.top='480px';g.style.display='block';announce('材料拿起','拖拽跟手，离架后抬起')}else if(name==='ingredient-snapback'){const g=$('ghost');g.innerHTML=icons.moon;g.style.left='1050px';g.style.top='500px';g.style.display='block';setTimeout(()=>{g.classList.add('snapback');g.style.left='1190px';g.style.top='300px';announce('材料弹回架上','锅外释放不失败');setTimeout(()=>{g.style.display='none';g.classList.remove('snapback')},300)},50)}else if(name==='ingredient-correct')submitIngredient(r.steps[0].ingredientId);else if(name==='ingredient-wrong')submitIngredient('red');else if(name==='stir-ready'||name==='stir-valid'||name==='stir-invalid'||name==='stir-wrong-direction'){state.step=r.steps.findIndex(s=>s.kind==='stir');visual();if(name==='stir-valid')submitTurn(r.steps[state.step].direction);if(name==='stir-invalid')announce('无效轨迹已忽略','短弧或抖动不失败，棒始终沿固定轨道');if(name==='stir-wrong-direction')submitTurn(r.steps[state.step].direction==='clockwise'?'counterclockwise':'clockwise')}else if(name==='success'){state.step=r.steps.length-1;state.turns=r.steps.at(-1).turns-1;visual();submitTurn(r.steps.at(-1).direction)}else if(name==='failure')finish('failure','原型状态预览：明确错误投入');else if(name==='exit-confirm')exitConfirm();else if(name==='disabled'){state.locked=true;visual();announce('演出中 · 输入锁定','所有玩法输入暂不可用')}}
  $('ctrl-state').addEventListener('change',ev=>{reviewState(ev.target.value);ev.target.value=''});
  const media=matchMedia('(prefers-reduced-motion: reduce)');state.motion=media.matches;media.addEventListener('change',ev=>{state.motion=ev.matches;visual()});
  $('bubbles').innerHTML=Array.from({length:12},(_,i)=>`<span class="bubble" style="left:${10+(i*47)%78}%;top:${8+(i*31)%72}%;width:${7+(i*5)%15}px;height:${7+(i*5)%15}px;animation-delay:-${(i*.27).toFixed(2)}s"></span>`).join('');
  window.__potionPrototype={state,recipes,ingredients,start,submitIngredient,submitTurn,reviewState,auto,finish,localPoint,inPot};start(0);
})();
</script>
