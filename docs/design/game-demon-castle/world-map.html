<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>月影魔王城 · 世界地图审阅</title><style>
*{box-sizing:border-box} body{margin:0;background:#171326;color:#f6ebcf;font:16px/1.5 system-ui,sans-serif;padding:34px}.card{max-width:1280px;margin:auto;background:#28203c;border:1px solid #a77bd0;border-radius:18px;padding:28px;box-shadow:0 20px 55px #0008}h1{margin:0;color:#e8c5ff}.sub{color:#cdb7d9}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.tag{border-radius:99px;padding:5px 10px;background:#3a3153}.dot{width:12px;height:12px;display:inline-block;border-radius:2px;margin-right:6px}.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.map{background:#120e1f;border:1px solid #706083;border-radius:13px;padding:14px}.grid{display:grid;grid-template-columns:repeat(20,1fr);aspect-ratio:20/14;border:1px solid #4d4263}.cell{border:1px solid #ffffff0b}.court{background:#69504d}.forest{background:#365949}.workshop{background:#4a475b}.zone{outline:3px solid #f0bd68;outline-offset:-3px;background-image:linear-gradient(#f0bd6828,#f0bd6828)}.building{background:#582f60;position:relative}.building::after{content:"◆";position:absolute;inset:0;display:grid;place-items:center;color:#f5d7ff;font-size:12px}.warp{background:#77cce0!important;position:relative}.warp::after{content:"↔";position:absolute;inset:0;display:grid;place-items:center;color:#07151b;font-weight:900}.player{background:#f5c45b!important;position:relative}.player::after{content:"♛";position:absolute;inset:0;display:grid;place-items:center;color:#241226;font-size:12px}h2{margin:0;font-size:19px}.note{margin-top:20px;padding:14px;background:#211a31;border-left:4px solid #f0bd68}@media(max-width:800px){body{padding:12px}.maps{grid-template-columns:1fr}}
</style></head><body><main class="card"><h1>月影魔王城 · 世界地图审阅</h1><p class="sub">世界切片 v1 · 20×14 格 × 3 场景 · 黄色为女主起点，蓝色为双向传送，紫色为静态建筑占位。</p><div class="legend"><span class="tag"><i class="dot" style="background:#69504d"></i>城堡庭院：可耕作</span><span class="tag"><i class="dot" style="background:#365949"></i>月影森林：采集</span><span class="tag"><i class="dot" style="background:#4a475b"></i>地底工坊：采矿</span><span class="tag"><i class="dot" style="background:#f0bd68"></i>行动区域</span></div><section class="maps" id="maps"></section><p class="note">本图只审阅世界空间、功能区域、静态建筑锚点与传送闭环；NPC、资源节点、作物、剧情锁和实际纹理素材尚未进入此切片。下一关将把角色与可交互实体接入这些已固定的格子。</p></main><script>
const scenes=[
{id:'moon-courtyard',name:'月影庭院',kind:'court',zones:[['courtyard-garden',2,8,6,4]],buildings:[[7,1,6,3,'王座厅'],[1,2,4,3,'温室遗址'],[17,5,2,2,'森林拱门'],[9,11,2,2,'地底阶梯']],warps:[[18,7]],player:[10,9]},
{id:'moonshadow-forest',name:'月影森林',kind:'forest',zones:[['moonshadow-forage',3,2,14,10]],buildings:[[10,5,2,2,'月井'],[14,3,3,3,'古树']],warps:[[1,7]]},
{id:'undercrypt-workshop',name:'地底工坊',kind:'workshop',zones:[['undercrypt-vein',3,5,14,7]],buildings:[[8,6,4,3,'熔炉核心'],[15,8,2,3,'封印库']],warps:[[10,1]]}
];
const inside=(x,y,r)=>x>=r[1]&&x<r[1]+r[3]&&y>=r[2]&&y<r[2]+r[4];
for(const s of scenes){const el=document.createElement('article');el.className='map';el.innerHTML='<h2>'+s.name+'</h2><small>'+s.id+'</small><div class="grid"></div>';const g=el.querySelector('.grid');for(let y=0;y<14;y++)for(let x=0;x<20;x++){const c=document.createElement('i');c.className='cell '+s.kind;const z=s.zones.find(r=>inside(x,y,r));if(z)c.classList.add('zone');const b=s.buildings.find(r=>inside(x,y,r));if(b){c.classList.add('building');c.title=b[4]}if(s.warps.some(p=>p[0]===x&&p[1]===y))c.classList.add('warp');if(s.player&&s.player[0]===x&&s.player[1]===y)c.classList.add('player');g.append(c)}document.querySelector('#maps').append(el)}
</script></body></html>
