 {title:'点亮王座厅',text:'收集月木与影矿，重燃城堡的第一盏灯。',goal:'收集月木 1/2 · 影矿 0/1',icon:'moon'},
 {title:'温室的裂纹',text:'种出两朵月铃花，准备修复月庭温室。',goal:'月铃花 0/2 · 月木 1/1',icon:'leaf'},
 {title:'熔炉仍在呼吸',text:'完成温室修复后，石像鬼工匠会告诉你熔炉的秘密。',goal:'尚未解锁：先修复温室',icon:'crystal',locked:true}
];
const items=[['月铃花种子','leaf',4,'在翻土并浇水的温室土地上种植，成熟后用于修复温室。'],['月铃花','leaf',2,'柔和的月光凝结在花瓣上。建设材料。'],['月木','leaf',1,'可用于修复王座厅和温室的木材。'],['影矿','crystal',3,'从地底工坊的矿脉中采集。'],['旧矿镐','star',1,'前往地底工坊采矿的工具。'],['月光水壶','moon',1,'照料种在温室中的作物。']];
const configs={quest:{title:'复兴任务',subtitle:'追踪一项任务到左上 HUD',icon:'book',tabs:['进行中','已完成']},bag:{title:'魔王行囊',subtitle:'整理种子、材料与远行工具',icon:'bag',tabs:['全部','种子','材料']},profile:{title:'城主档案',subtitle:'莉娅与月影城堡的当前状态',icon:'person',tabs:['档案','关系','城堡']}};
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),use=document.createElementNS(svg.namespaceURI,'use');use.setAttribute('href','#i-'+name);svg.setAttribute('aria-hidden','true');svg.append(use);return svg;}
function message(text){$('toast').textContent=text;$('toast').hidden=false;}
function syncPanelTop(){if(innerWidth<=560)$('stage').style.setProperty('--side-top',Math.max(390,$('tracker').getBoundingClientRect().bottom+18)+'px');else $('stage').style.removeProperty('--side-top');}
function renderTracker(){const q=quests[state.tracked];$('tracked-title').textContent=state.mode==='empty'?'当前没有追踪任务':state.long?'修复被月影风暴损毁的王座厅与月庭温室':q.title;$('tracked-progress').textContent=state.mode==='empty'?'打开任务日志，选择想要完成的目标。':state.long?'前往月影森林收集两份月木，再拜访地底工坊的石像鬼工匠取得影矿，返回庭院点亮第一盏月灯。':q.goal;syncPanelTop();}
function closePanel(){state.panel=null;$('side-panel').hidden=true;$('stage').classList.remove('panel-open');entries.forEach(e=>e.setAttribute('aria-expanded','false'));}
function openPanel(panel){const trigger=$('entry-'+panel);if(trigger.disabled)return;if(state.panel===panel){closePanel();return;}state.panel=panel;state.tab=0;renderPanel();}
function emptyContent(){const box=node('div','empty');box.append(icon(configs[state.panel].icon),node('h3','',state.panel==='quest'?'当前没有可追踪任务':state.panel==='bag'?'行囊暂时是空的':'还没有这部分档案'),node('p','',state.panel==='quest'?'探索月影庭院，与居民交谈后再回来看看。':state.panel==='bag'?'在森林中采集，或收获你种下的月铃花。':'这一页会在新的旅程与相遇中逐渐丰富。'));const reset=node('button','track','返回正常示例');reset.addEventListener('click',()=>{state.tab=0;$('demo-mode').value='normal';setMode('normal');});box.append(reset);$('panel-body').append(box);$('panel-count').textContent='暂无内容';}
function renderQuests(){if(state.tab===1){emptyContent();return;}const count=state.mode==='long'?24:quests.length;for(let i=0;i<count;i++){const q=quests[i%3],row=node('article','quest-row'+(i===state.tracked?' selected':'')),mark=node('span','row-icon');mark.append(icon(q.icon));const content=node('div');content.append(node('h3','',q.title+(i>2?' · 第 '+(i+1)+' 页':'')),node('p','',state.mode==='long'?q.text+' 在离开庭院前请检查材料是否齐备，任务会一直保留在日志中。':q.text),node('div','progress',q.goal));const b=node('button','track',q.locked?'未解锁':i===state.tracked?'正在追踪':'追踪任务');b.disabled=!!q.locked||i===state.tracked;b.dataset.track=String(i);b.addEventListener('click',()=>{state.tracked=i%3;state.long=false;$('tracker-long').checked=false;renderTracker();$('tracker').classList.remove('flash');void $('tracker').offsetWidth;$('tracker').classList.add('flash');renderPanel();message('已追踪：'+q.title);});content.append(b);row.append(mark,content);$('panel-body').append(row);}$('panel-count').textContent=count+' 项任务';}
function renderBag(){const grid=node('div','bag-grid');let filtered=items.map((a,i)=>({a,i})).filter(({i})=>state.tab===0||state.tab===1&&i===0||state.tab===2&&i>=1&&i<=3);const count=state.mode==='long'?60:12;for(let i=0;i<count;i++){const item=state.mode==='long'?filtered[i%filtered.length]:filtered[i],b=node('button','slot'+(item?.i===state.selection?' selected':''));if(item){b.append(icon(item.a[1]),node('strong','',String(item.a[2])));b.title=item.a[0];b.setAttribute('aria-label',item.a[0]+' ×'+item.a[2]);b.addEventListener('click',()=>{state.selection=item.i;renderPanel();message('已选择：'+item.a[0]);});}else{b.disabled=true;b.setAttribute('aria-label','空格');}grid.append(b);}$('panel-body').append(grid);const chosen=items[state.selection],detail=node('div','bag-detail');detail.append(node('h3','',chosen[0]),node('p','',chosen[3]));$('panel-body').append(detail);$('panel-count').textContent=state.mode==='long'?'60 格长背包示例':'12 格 · 已用 '+filtered.length+' 格';}
function renderProfile(){if(state.tab===0){const top=node('div','profile-top'),portrait=node('div','portrait'),img=node('img');img.src='../../../public/games/game-demon-castle/art/sprites/player-moon-demon.png';img.alt='沿用现有莉娅立绘';portrait.append(img);const intro=node('div');intro.append(node('h3','','莉娅 · 月影城主'),node('p','','失而复得的魔王城继承人'));for(const [label,value]of[['月能',68],['建造术',42]]){const meter=node('div','meter'),heading=node('label','',label+'　'+value+'/100'),p=node('progress');p.value=value;p.max=100;p.setAttribute('aria-label',label);meter.append(heading,p);intro.append(meter);}top.append(portrait,intro);$('panel-body').append(top);}const rows=state.tab===1?[['工匠盟约',20,'person'],['管家信赖',8,'moon']]:state.tab===2?[['王座厅修复',12,'star'],['温室修复',6,'leaf'],['已解锁建筑',1,'book']]:[['城堡威望',12,'star'],['居民信赖',8,'person'],['月影修复度',6,'moon'],['月能储备',14,'crystal'],['已解锁建筑',1,'book']];for(let i=0,n=state.mode==='long'?28:rows.length;i<n;i++){const [title,value,symbol]=rows[i%rows.length],row=node('div','stat');row.append(icon(symbol),node('span','',title+(i>=rows.length?' · 档案 '+(i+1):'')),node('output','',String(value)));$('panel-body').append(row);}$('panel-body').append(node('p','profile-note','数值为原型演示数据。实际角色状态由共享 Life Profile 投影提供；此页没有新增游戏规则。'));$('panel-count').textContent='城主只读档案';}
function renderPanel(){if(!state.panel)return;const c=configs[state.panel];$('side-panel').hidden=false;$('stage').classList.add('panel-open');$('side-panel').dataset.panel=state.panel;entries.forEach(e=>e.setAttribute('aria-expanded',String(e.dataset.panel===state.panel)));$('panel-title').textContent=c.title;$('panel-subtitle').textContent=c.subtitle;$('panel-mark').replaceChildren(icon(c.icon));$('panel-tabs').replaceChildren();c.tabs.forEach((label,index)=>{const b=node('button','',label);b.setAttribute('role','tab');b.setAttribute('aria-selected',String(state.tab===index));b.addEventListener('click',()=>{state.tab=index;renderPanel();});$('panel-tabs').append(b);});$('panel-body').replaceChildren();$('panel-body').scrollTop=0;if(state.mode==='empty')emptyContent();else({quest:renderQuests,bag:renderBag,profile:renderProfile})[state.panel]();requestAnimationFrame(()=>{$('scroll-hint').hidden=$('panel-body').scrollHeight<=$('panel-body').clientHeight;});}
function setMode(mode){state.mode=mode;state.long=mode==='long';$('tracker-long').checked=state.long;renderTracker();renderPanel();}
entries.forEach(e=>e.addEventListener('click',()=>openPanel(e.dataset.panel)));$('panel-close').addEventListener('click',closePanel);
$('demo-mode').addEventListener('change',e=>setMode(e.target.value));$('tracker-long').addEventListener('change',e=>{state.long=e.target.checked;renderTracker();});
$('button-state').addEventListener('change',e=>{entries.forEach(b=>{b.removeAttribute('data-demo-state');b.disabled=false;});if(e.target.value==='disabled')$('entry-profile').disabled=true;else if(e.target.value!=='default')$('entry-quest').dataset.demoState=e.target.value;});
$('demo-resources').addEventListener('click',()=>{state.resources++;[30+state.resources,20+state.resources].forEach((value,i)=>{const el=document.querySelectorAll('.resource')[i];el.querySelector('output').textContent=String(value);el.setAttribute('aria-label',el.title+' '+value);el.classList.remove('updated');void el.offsetWidth;el.classList.add('updated');});message('两项示例值已更新，资源与入口保持同一横排');});
$('demo-day').addEventListener('click',()=>{state.day++;$('day').textContent='·第'+state.day+'天';$('clock').textContent='黎明';message('月相季·第'+state.day+'天 · 黎明');});
$('demo-reset').addEventListener('click',()=>location.reload());$('world-hint').addEventListener('click',()=>message('近身互动提示演示：前往月影森林'));
document.addEventListener('keydown',e=>{if(e.code==='F2'){e.preventDefault();$('review-tools').open=!$('review-tools').open;return;}if(e.code==='Escape'){closePanel();return;}if(e.repeat||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const map={KeyJ:'quest',KeyI:'bag',KeyC:'profile'};if(map[e.code]){e.preventDefault();openPanel(map[e.code]);}if(e.code==='KeyE')$('world-hint').click();});
addEventListener('resize',syncPanelTop);syncPanelTop();
</script>
