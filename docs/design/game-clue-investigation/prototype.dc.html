  <style>

    .hotspot.alpha-hover:before,.hotspot:focus-visible:before,.hotspot.focused:before { background:color-mix(in srgb,var(--glow) 24%,transparent);outline:none;filter:drop-shadow(0 0 9px var(--glow)); } .hotspot.clue { --glow:var(--clue); } .hotspot.alpha-hover:after,.hotspot:focus-visible:after,.hotspot.focused:after { opacity:1;transform:translateX(-50%) translateY(0); }
    .hotspot.pressed { transform:scale(.95);filter:brightness(1.45); } .hotspot.collected { --glow:#7bb996; } .hotspot[disabled] { cursor:not-allowed;opacity:.42;filter:grayscale(.65); }
    .h-lock{left:194px;top:370px;width:104px;height:126px}.h-shelf{left:404px;top:123px;width:362px;height:486px}.h-clock{right:143px;top:92px;width:185px;height:184px}.h-cup{right:456px;bottom:298px;width:102px;height:90px}.h-rug{left:99px;bottom:19px;width:780px;height:214px}.h-prints{right:337px;bottom:196px;width:250px;height:132px}.h-letter{right:178px;bottom:275px;width:190px;height:145px}
    .hitboxes .hotspot { border:2px dashed #ff68be!important;background:#ff68be22!important;opacity:1!important; } .hitboxes .hotspot:before{display:none}.hitboxes .hotspot:after{opacity:1;transform:translateX(-50%);}
    .archive-bar { display:none;position:absolute;z-index:10;left:0;right:0;bottom:0;height:178px;padding:20px 70px;background:linear-gradient(#11212ae8,#091219fa);border-top:2px solid #ab946a;box-shadow:0 -10px 30px #0009;will-change:transform; } .archive-bar.visible{display:block;animation:archive-enter .22s ease-out both}@keyframes archive-enter{from{transform:translateY(100%)}to{transform:translateY(0)}}.archive-bar h2{margin:0 0 9px;color:#eed09a;font-size:18px;letter-spacing:.12em}.archive-bar p{margin:0;font-size:19px}.archive-bar .continue{position:absolute;right:64px;bottom:26px;}
    .veil { position:absolute;z-index:20;inset:0;display:none;place-items:center;background:#05090cc9;backdrop-filter:blur(3px); } .veil.open { display:grid; } .evidence { position:relative;width:820px;min-height:560px;padding:26px 40px;background:linear-gradient(145deg,#e7ddc2,#bba875);color:#1b211d;border:12px solid #5d452e;box-shadow:0 22px 70px #000;animation:lift .24s ease-out both; } @keyframes lift { from{transform:translateY(44px) scale(.94);opacity:0}to{transform:none;opacity:1} } .evidence .stamp{position:absolute;right:34px;top:25px;border:5px solid #ab3d32;color:#a9372d;padding:8px 13px;font-weight:900;font-size:22px;transform:rotate(12deg);opacity:0;}.evidence.collected .stamp{animation:stamp .38s ease-out forwards}.evidence h2{margin:8px 0;color:#352617;font-size:34px}.evidence p{font-size:19px;max-width:585px;line-height:1.6}.evidence-art{height:274px;margin:18px 0;background:#293b40;display:grid;place-items:center;border:7px solid #7a6345;overflow:hidden;}.evidence-art svg{width:100%;height:100%;}.evidence .evidence-action{float:right;color:#251b11;background:#e3b765;border:2px solid #51371e;padding:11px 20px;font-weight:700;cursor:pointer}.evidence .evidence-action:focus-visible{outline:3px solid #139ca4;outline-offset:3px}@keyframes stamp{from{transform:scale(1.8) rotate(12deg);opacity:0}to{transform:scale(1) rotate(12deg);opacity:.86}}
    .completion { text-align:center;width:690px;padding:52px;background:linear-gradient(145deg,#102a30,#112018);border:1px solid #d5b66d;box-shadow:0 0 0 12px #d2a54c22,0 24px 70px #000;animation:lift .6s ease-out both; } .completion .seal{font-size:78px;color:#ecc368;text-shadow:0 0 23px #edbb5a88}.completion h2{font-size:42px;margin:6px}.completion p{color:#d6e0d5;font-size:19px}.completion .ui-btn{margin-top:12px}
    .confirm { width:520px;padding:34px;background:#152027;border:1px solid #c29e68;box-shadow:0 20px 70px #000;text-align:center }.confirm h2{margin-top:0}.confirm .actions{display:flex;justify-content:center;gap:14px;margin-top:22px}.danger{border-color:#b55a52;color:#ffe2dc}.prototype-panel{position:absolute;z-index:40;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:8px 12px;background:#0c1117df;border:1px solid #5b6570;border-radius:7px;font-size:12px}.prototype-panel label{color:#bcd0d0}.prototype-panel select,.prototype-panel button{background:#1b2b34;color:#e8efeb;border:1px solid #536673;border-radius:4px;padding:5px 8px}.status-strip{position:absolute;z-index:41;left:50%;top:68px;transform:translateX(-50%);padding:5px 11px;border-radius:999px;background:#101d25dc;color:#a9c8c8;font-size:12px;letter-spacing:.08em;}
    .reduced *, .reduced *:before,.reduced *:after { animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important; }
    @media(max-width:1450px){.stage-wrap{display:block;padding:0;min-height:0}.prototype-panel{position:fixed;top:auto;bottom:8px}.status-strip{position:fixed;top:8px}.stage-wrap{width:1440px;transform:scale(var(--stage-scale,1));transform-origin:top left;height:calc(900px * var(--stage-scale,1));}}
  </style>

<body>
<main class="stage-wrap" id="wrap"><section id="stage" aria-label="现场搜证 HTML 原型">
  <div class="room" role="img" aria-label="原创 AI 生成演示：雨夜旧书房与档案室现场"><img class="ai-background" src="ui-refs/rainy-archive-background-ai-v1.png" alt="原创 AI 生成的雨夜档案室背景"><img class="prop-art prop-lock" id="alpha-lock" src="ui-refs/damaged-window-latch-ai-v1.png" alt="原创 AI 生成的破损窗锁"><img class="prop-art prop-shelf" id="alpha-shelf" src="ui-refs/archive-bookcase-ai-v1.png" alt="原创 AI 生成的旧书架"><img class="prop-art prop-clock" id="alpha-clock" src="ui-refs/stopped-clock-ai-v1.png" alt="原创 AI 生成的停摆挂钟"><img class="prop-art prop-cup" id="alpha-cup" src="ui-refs/cold-teacup-ai-v1.png" alt="原创 AI 生成的冷茶杯"><img class="prop-art prop-rug" id="alpha-rug" src="ui-refs/worn-rug-ai-v1.png" alt="原创 AI 生成的褪色地毯"><img class="prop-art prop-prints" id="alpha-prints" src="ui-refs/wet-footprints-ai-v1.png" alt="原创 AI 生成的湿脚印"><img class="prop-art prop-letter" id="alpha-letter" src="ui-refs/burned-letter-ai-v1.png" alt="原创 AI 生成的半烧毁信件"></div>
  <div class="hud"><div class="top-card"><div class="eyebrow">CASE / 07 · 原创占位现场</div><h1>雨夜档案室</h1><p class="goal">目标：找出入侵者留下的两项必要证物。</p></div><div class="progress"><small>必需线索进度</small><strong id="progress">0 / 2</strong></div><details class="case-list" open><summary>线索清单</summary><ul id="clueList"><li class="pending">破损窗锁 · 未收录</li><li class="pending">桌上湿脚印 · 未收录</li><li class="pending">半烧毁信件 · 可选</li></ul></details><div class="utility"><button class="ui-btn" id="openList" type="button">查看记录</button><button class="ui-btn" id="exitBtn" type="button">退出调查</button></div></div>
  <div id="hotspots" aria-label="可调查物件"></div>
  <section class="archive-bar" id="archiveBar" aria-live="polite"><h2 id="barTitle">现场记录</h2><p id="barText"></p><button class="ui-btn continue" id="barContinue" type="button">继续调查</button></section>
  <div class="veil" id="evidenceVeil" aria-hidden="true"><article class="evidence" id="evidenceCard" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle"><div class="stamp">已收录</div><div class="eyebrow">EVIDENCE / 原创占位</div><h2 id="evidenceTitle">线索</h2><div class="evidence-art" id="evidenceArt"></div><p id="evidenceText"></p><button class="evidence-action" id="collectBtn" type="button">收录线索</button></article></div>
  <div class="veil" id="completeVeil" aria-hidden="true"><article class="completion" role="dialog" aria-modal="true"><div class="seal">✦</div><div class="eyebrow">INVESTIGATION COMPLETE</div><h2>现场调查完成</h2><p>两项必要证物已归档。此原型只演示成功结果；正式宿主将处理其后的知识与剧情。</p><button class="ui-btn" id="restartBtn" type="button">重新检查现场</button></article></div>
  <div class="veil" id="exitVeil" aria-hidden="true"><article class="confirm" role="dialog" aria-modal="true" aria-labelledby="exitTitle"><div class="eyebrow">CANCELLED / 演示语义</div><h2 id="exitTitle">暂时离开现场？</h2><p>退出会取消本次演示，不会被呈现为调查失败。</p><div class="actions"><button class="ui-btn" id="exitCancel" type="button">返回现场</button><button class="ui-btn danger" id="exitConfirm" type="button">确认取消演示</button></div></article></div>
  <aside class="prototype-panel" aria-label="原型控制，仅供审阅"><label>原型控制</label><button id="resetBtn" type="button">重置</button><button id="autoBtn" type="button">自动播放</button><select id="stateSelect" aria-label="直接切换状态"><option value="scene-idle">scene-idle</option><option value="object-hover">object-hover</option><option value="object-pressed">object-pressed</option><option value="flavor-result">flavor-result</option><option value="clue-reveal">clue-reveal</option><option value="clue-collected">clue-collected</option><option value="completed">completed</option><option value="exit-confirm">exit-confirm</option><option value="disabled">disabled</option></select><button id="hitboxBtn" type="button">热点：关</button><button id="motionBtn" type="button">reduced-motion：关</button></aside><div class="status-strip" id="statusStrip">STATE · scene-idle</div>
</section></main>
<script>
(() => {
  const objects = [
    {id:'lock',label:'破损窗锁',kind:'clue',required:true,cls:'h-lock',img:'alpha-lock',mask:'damaged-window-latch-ai-v1.png',text:'锁扣内侧有新鲜撬痕。有人从室内先松开了它。',art:'lock'},
    {id:'shelf',label:'旧书架',kind:'flavor',cls:'h-shelf',img:'alpha-shelf',mask:'archive-bookcase-ai-v1.png',text:'书脊被潮气卷起；最下层留有刚被抽走一册的空隙。'},
    {id:'clock',label:'挂钟',kind:'flavor',cls:'h-clock',img:'alpha-clock',mask:'stopped-clock-ai-v1.png',text:'钟摆停在 23:17。玻璃表面蒙着一层薄雾。'},
    {id:'cup',label:'冷掉的茶杯',kind:'flavor',cls:'h-cup',img:'alpha-cup',mask:'cold-teacup-ai-v1.png',text:'杯沿仍留着一圈未干的水痕，茶已经完全冷了。'},
    {id:'rug',label:'褪色地毯',kind:'flavor',cls:'h-rug',img:'alpha-rug',mask:'worn-rug-ai-v1.png',text:'地毯边缘被匆忙掀起过，下面没有藏着第二个出口。'},
    {id:'prints',label:'桌上湿脚印',kind:'clue',required:true,cls:'h-prints',img:'alpha-prints',mask:'wet-footprints-ai-v1.png',text:'鞋底纹沾着窗边的泥水，方向直指书桌。',art:'prints'},
    {id:'letter',label:'半烧毁信件',kind:'clue',required:false,cls:'h-letter',img:'alpha-letter',mask:'burned-letter-ai-v1.png',text:'残留的日期与一枚陌生署名，没有改变必要证物的数量。',art:'letter'}
  ];
  const state={collected:new Set(),viewed:new Set(),active:null,hitboxes:false,reduced:false,disabled:false,autoplay:false};
  const $=s=>document.querySelector(s), hotspots=$('#hotspots'), strip=$('#statusStrip'), stage=$('#stage');
  function evidenceSvg(type){ const files={lock:['damaged-window-latch-ai-v1.png','原创 AI 生成证物：有撬痕的窗锁'],prints:['wet-footprints-ai-v1.png','原创 AI 生成证物：带泥水的鞋底纹'],letter:['burned-letter-ai-v1.png','原创 AI 生成证物：半烧毁信件']};const [file,alt]=files[type];return `<img src="ui-refs/${file}" alt="${alt}" style="width:100%;height:100%;object-fit:contain;background:radial-gradient(ellipse,#52696a,#19262a)">`; }
  const alphaCanvases=new Map(), ALPHA_THRESHOLD=150;
  function alphaContext(o){
    if(alphaCanvases.has(o.id))return alphaCanvases.get(o.id);
    const img=$(`#${o.img}`);if(!img?.complete||!img.naturalWidth)return null;
    try{
      const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
      const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
      const pixels=ctx.getImageData(0,0,c.width,c.height), mask=document.createElement('canvas');mask.width=c.width;mask.height=c.height;
      const maskCtx=mask.getContext('2d'), maskPixels=maskCtx.createImageData(c.width,c.height);
      for(let i=3;i<pixels.data.length;i+=4)maskPixels.data[i]=pixels.data[i]>=ALPHA_THRESHOLD?255:0;
      maskCtx.putImageData(maskPixels,0,0);
      document.querySelector(`[data-id="${o.id}"]`)?.style.setProperty('--mask',`url("${mask.toDataURL()}")`);
      alphaCanvases.set(o.id,ctx);return ctx;
    }catch{return null;}
  }
  function renderedImageRect(img){const r=img.getBoundingClientRect(),ratio=img.naturalWidth/img.naturalHeight,boxRatio=r.width/r.height;let width,height,left,top;if(boxRatio>ratio){height=r.height;width=height*ratio;left=r.left+(r.width-width)/2;top=r.top;}else{width=r.width;height=width/ratio;left=r.left;top=r.top+(r.height-height)/2;}return {left,top,width,height};}
  function alphaHit(o,clientX,clientY){const img=$(`#${o.img}`),ctx=alphaContext(o);if(!img||!ctx)return false;const r=renderedImageRect(img),x=(clientX-r.left)/r.width,y=(clientY-r.top)/r.height;if(x<0||y<0||x>1||y>1)return false;return ctx.getImageData(Math.floor(x*(ctx.canvas.width-1)),Math.floor(y*(ctx.canvas.height-1)),1,1).data[3]>=ALPHA_THRESHOLD;}
  function objectAt(clientX,clientY){return [...objects].reverse().find(o=>alphaHit(o,clientX,clientY))||null;}
  function syncAlphaHover(o){document.querySelectorAll('.hotspot').forEach(b=>b.classList.toggle('alpha-hover',b.dataset.id===o?.id));$('#stage').style.cursor=o?'pointer':'';if(o)setStatus('object-hover');}
  function build(){objects.forEach(o=>{const b=document.createElement('button');b.type='button';b.className=`hotspot ${o.kind} ${o.cls}`;b.style.setProperty('--mask',`url("ui-refs/${o.mask}")`);b.dataset.id=o.id;b.dataset.label=o.label;b.setAttribute('aria-label',`调查：${o.label}`);b.addEventListener('click',e=>{if(e.detail===0)activate(o,b);});b.addEventListener('focus',()=>setStatus('object-hover'));hotspots.append(b);});}
  function setStatus(name){strip.textContent=`STATE · ${name}`;$('#stateSelect').value=name;}
  function update(){const required=objects.filter(o=>o.required).length;const got=objects.filter(o=>o.required&&state.collected.has(o.id)).length;$('#progress').textContent=`${got} / ${required}`;$('#clueList').innerHTML=objects.filter(o=>o.kind==='clue').map(o=>`<li class="${state.collected.has(o.id)?'':'pending'}">${state.collected.has(o.id)?'✓ ':''}${o.label} · ${state.collected.has(o.id)?'已收录':o.required?'未收录':'可选'}</li>`).join('');document.querySelectorAll('.hotspot').forEach(b=>{const id=b.dataset.id;b.classList.toggle('collected',state.collected.has(id));b.classList.toggle('viewed',state.viewed.has(id));b.disabled=state.disabled;});}
  function disable(ms){state.disabled=true;update();setStatus('disabled');setTimeout(()=>{state.disabled=false;update();},ms);}
  function activate(o,b){if(state.disabled)return;state.active=o;b.classList.add('pressed');setStatus('object-pressed');setTimeout(()=>b.classList.remove('pressed'),state.reduced?1:145);disable(state.reduced?1:o.kind==='clue'?230:120);setTimeout(()=>{if(o.kind==='flavor')showFlavor(o);else showEvidence(o);},state.reduced?1:o.kind==='clue'?230:155);}
  function showFlavor(o){state.viewed.add(o.id);update();$('#barTitle').textContent=`现场记录 · ${o.label}`;$('#barText').textContent=o.text;$('#archiveBar').classList.add('visible');setStatus('flavor-result');$('#barContinue').focus({preventScroll:true});}
  function closeFlavor(){ $('#archiveBar').classList.remove('visible');setStatus('scene-idle'); }
  function showEvidence(o){const was=state.collected.has(o.id);$('#evidenceTitle').textContent=o.label;$('#evidenceText').textContent=o.text;$('#evidenceArt').innerHTML=evidenceSvg(o.art);$('#evidenceCard').classList.toggle('collected',was);$('#collectBtn').textContent=was?'回到现场':'收录线索';$('#evidenceVeil').classList.add('open');$('#evidenceVeil').setAttribute('aria-hidden','false');setStatus('clue-reveal');$('#collectBtn').focus({preventScroll:true});}
  function collect(){const o=state.active;if(!o)return;const fresh=!state.collected.has(o.id);if(fresh){state.collected.add(o.id);state.viewed.add(o.id);$('#evidenceCard').classList.add('collected');update();setStatus('clue-collected');disable(state.reduced?1:430);setTimeout(()=>closeEvidence(true),state.reduced?1:470);}else closeEvidence(false);}
  function closeEvidence(fresh){$('#evidenceVeil').classList.remove('open');$('#evidenceVeil').setAttribute('aria-hidden','true');const done=objects.filter(o=>o.required).every(o=>state.collected.has(o.id));if(done&&fresh){setTimeout(showComplete,state.reduced?1:690);}else{setStatus('scene-idle');}}
  function showComplete(){ $('#completeVeil').classList.add('open');$('#completeVeil').setAttribute('aria-hidden','false');setStatus('completed'); }
  function reset(){state.collected.clear();state.viewed.clear();state.active=null;state.disabled=false;['#archiveBar','#evidenceVeil','#completeVeil','#exitVeil'].forEach(id=>{$(id).classList.remove('open','visible');});document.querySelectorAll('.hotspot').forEach(b=>b.classList.remove('focused','pressed','alpha-hover'));$('#stage').style.cursor='';update();setStatus('scene-idle');}
  function openExit(){ $('#exitVeil').classList.add('open');$('#exitVeil').setAttribute('aria-hidden','false');setStatus('exit-confirm');$('#exitCancel').focus({preventScroll:true});}
  function closeExit(){ $('#exitVeil').classList.remove('open');$('#exitVeil').setAttribute('aria-hidden','true');setStatus('scene-idle'); }
  function preview(name){reset();const by=id=>objects.find(o=>o.id===id);if(name==='object-hover'){const b=document.querySelector('[data-id="lock"]');b.classList.add('focused');setStatus(name);} else if(name==='object-pressed'){const b=document.querySelector('[data-id="shelf"]');state.active=by('shelf');b.classList.add('pressed','focused');setStatus(name);} else if(name==='flavor-result'){showFlavor(by('clock'));} else if(name==='clue-reveal'){showEvidence(by('lock'));} else if(name==='clue-collected'){state.collected.add('lock');update();showEvidence(by('lock'));$('#evidenceCard').classList.add('collected');setStatus(name);} else if(name==='completed'){state.collected.add('lock');state.collected.add('prints');update();showComplete();} else if(name==='exit-confirm'){openExit();} else if(name==='disabled'){state.disabled=true;update();setStatus(name);} else setStatus('scene-idle');}
  async function autoplay(){if(state.autoplay)return;state.autoplay=true;reset();const by=id=>objects.find(o=>o.id===id);const wait=ms=>new Promise(r=>setTimeout(r,state.reduced?16:ms));for(const id of ['shelf','lock','prints']){const o=by(id),b=document.querySelector(`[data-id="${id}"]`);activate(o,b);await wait(o.kind==='clue'?300:280);if(o.kind==='flavor'){closeFlavor();await wait(180);}else{collect();await wait(1200);}}state.autoplay=false;}
  stage.addEventListener('pointermove',e=>{if(e.target.closest('.hud,.prototype-panel,.archive-bar,.veil'))return syncAlphaHover(null);syncAlphaHover(objectAt(e.clientX,e.clientY));});stage.addEventListener('pointerleave',()=>syncAlphaHover(null));stage.addEventListener('click',e=>{if(e.target.closest('.hud,.prototype-panel,.archive-bar,.veil'))return;const o=objectAt(e.clientX,e.clientY);if(o)activate(o,document.querySelector(`[data-id="${o.id}"]`));});
  $('#barContinue').onclick=closeFlavor;$('#collectBtn').onclick=collect;$('#restartBtn').onclick=reset;$('#resetBtn').onclick=reset;$('#autoBtn').onclick=autoplay;$('#exitBtn').onclick=openExit;$('#exitCancel').onclick=closeExit;$('#exitConfirm').onclick=()=>{closeExit();$('#barTitle').textContent='演示已取消';$('#barText').textContent='取消不是失败：正式宿主不应施加任何失败代价。';$('#archiveBar').classList.add('visible');};$('#openList').onclick=()=>$('.case-list').open=true;
  $('#stateSelect').onchange=e=>preview(e.target.value);$('#hitboxBtn').onclick=()=>{state.hitboxes=!state.hitboxes;hotspots.classList.toggle('hitboxes',state.hitboxes);$('#hitboxBtn').textContent=`热点：${state.hitboxes?'开':'关'}`;};$('#motionBtn').onclick=()=>{state.reduced=!state.reduced;$('#stage').classList.toggle('reduced',state.reduced);$('#motionBtn').textContent=`reduced-motion：${state.reduced?'开':'关'}`;};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#evidenceVeil').classList.contains('open'))closeEvidence(false);else if($('#exitVeil').classList.contains('open'))closeExit();else if($('#archiveBar').classList.contains('visible'))closeFlavor();else openExit();}});
  function scale(){const s=Math.min(1,innerWidth/1440,innerHeight/900);document.documentElement.style.setProperty('--stage-scale',s.toFixed(4));}addEventListener('resize',scale);build();update();scale();
})();
</script>
</body></html>
