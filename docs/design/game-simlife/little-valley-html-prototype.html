<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小山谷｜自由移动交互原型</title>
  <style>
    :root { --ink:#243327; --gold:#eeaf36; --tile:60px; --world-w:960px; --world-h:600px; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); background:#233a2b; font-family:"Microsoft YaHei",system-ui,sans-serif; overflow:hidden }
    button { font:inherit; cursor:pointer }.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(135deg,#dbe6b9,#edf4ce 50%,#d0e0b8)}
    header{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 22px;background:rgba(255,249,232,.94);border-bottom:4px solid #b77828;box-shadow:0 3px 0 rgba(46,54,26,.2);z-index:4}.brand{display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;display:grid;place-items:center;background:var(--gold);border:3px solid #6f451e;border-radius:12px;box-shadow:inset 0 4px #ffe486,0 3px #6f451e;font-size:22px}.brand b{font-size:19px}.brand small{color:#6c7657;display:block;margin-top:2px}.hud{display:flex;align-items:center;gap:10px}.chip{background:#fff8dc;border:2px solid #a9a16b;border-radius:999px;padding:7px 11px;box-shadow:0 2px #c6ba79;font-size:13px}.chip strong{color:#a2601a}.bag{display:flex;gap:6px}.slot{min-width:45px;padding:5px;text-align:center;background:#4c392a;color:#fff7db;border:3px solid #a47442;border-radius:7px}.slot.active{outline:3px solid #f5d251;transform:translateY(-2px)}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 286px}.world-wrap{position:relative;min-width:0;min-height:0;overflow:auto;background:#3c703c;padding:24px;display:flex;justify-content:center;align-items:center}.world{width:var(--world-w);height:var(--world-h);min-width:var(--world-w);min-height:var(--world-h);display:grid;grid-template-columns:repeat(16,var(--tile));grid-template-rows:repeat(10,var(--tile));border:9px solid #274a2a;box-shadow:0 0 0 4px #9bc361,0 18px 32px rgba(18,51,28,.35);image-rendering:pixelated;background:#78ad49;position:relative}.tile{width:var(--tile);height:var(--tile);position:relative;border:1px solid rgba(49,98,45,.16);overflow:hidden}.grass{background:radial-gradient(circle at 22% 25%,#bde576 0 3%,transparent 4%),radial-gradient(circle at 75% 72%,#5e963c 0 3%,transparent 4%),#78ad49}.path{background:radial-gradient(circle at 32% 38%,#c99a49 0 5%,transparent 6%),#dcb45c}.water{background:repeating-linear-gradient(0deg,#62b3d4 0 7px,#75c5dc 7px 12px);border-color:#3d8eaf}.soil{background:repeating-linear-gradient(90deg,#ad6130 0 7px,#c87b3e 7px 13px);border-color:#86421e}.tilled{background:repeating-linear-gradient(0deg,#81451f 0 5px,#b7682e 5px 11px)}.watered{background:repeating-linear-gradient(0deg,#406f74 0 5px,#5e9ba2 5px 11px)}.tile::after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.12) 8px 9px)}.object{position:absolute;inset:6%;display:grid;place-items:center;z-index:2;filter:drop-shadow(2px 3px 0 rgba(31,56,28,.28));font-size:32px}.house{inset:0;background:linear-gradient(#c55635 0 34%,#f4c270 34% 100%);clip-path:polygon(10% 34%,50% 0,90% 34%,90% 100%,10% 100%);border:4px solid #6b4123}.house::after{content:"";width:22%;height:26%;background:#5f3b26;border:3px solid #f5d681;margin:42% auto 0;display:block}.tree{font-size:43px}.crop{font-size:28px}.npc{font-size:35px}.player{position:absolute;width:32px;height:42px;border-radius:48% 48% 42% 42%;background:#f7c745;border:4px solid #6b451d;box-shadow:inset 0 5px #fff2a7,3px 4px 0 rgba(44,60,26,.4);transform:translate(-50%,-60%);z-index:8;display:grid;place-items:center;font-size:17px;pointer-events:none}.player::after{content:"";position:absolute;width:52px;height:16px;left:50%;bottom:-13px;transform:translateX(-50%);border-radius:50%;background:rgba(27,65,31,.28);z-index:-1}.prompt{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff5d7;color:#3e3522;border:3px solid #744821;border-radius:10px;padding:8px 12px;font-weight:700;box-shadow:0 4px #70421d;z-index:10;white-space:nowrap}.key{display:inline-grid;place-items:center;min-width:24px;height:24px;margin-right:6px;background:#573a24;color:#fff8de;border-radius:5px;box-shadow:inset 0 2px #9b7047;font-size:12px}
    aside{background:#fff9e9;border-left:4px solid #8a6132;padding:14px;overflow:auto;box-shadow:-5px 0 18px rgba(31,54,25,.18);z-index:3}.panel{background:#f8edcf;border:2px solid #c7ad73;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:inset 0 2px rgba(255,255,255,.7)}.panel h2{margin:0 0 8px;font-size:15px;color:#765024}.panel p{margin:0;color:#617154;font-size:13px;line-height:1.55}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.action{min-height:41px;border:3px solid #653e1e;border-radius:10px;color:#fff8dd;background:linear-gradient(#66985c,#3e6c44);box-shadow:inset 0 3px rgba(255,255,255,.28),0 3px #653e1e;font-weight:800}.action.gold{background:linear-gradient(#ffd568,#d48a1f)}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:17px;height:17px;border-radius:4px;border:1px solid #55452f}.toast{min-height:46px;color:#46623d;font-size:13px}.toast strong{color:#a15a20}footer{min-height:48px;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 18px;background:#2f4d31;color:#e8f0c6;font-size:13px}.footer-key{border:1px solid #a8c17a;border-radius:4px;padding:2px 6px;color:#fff6cf}
    .modal-backdrop{position:fixed;inset:0;display:none;place-items:center;background:rgba(22,42,29,.58);z-index:20}.modal-backdrop.open{display:grid}.modal{width:min(430px,calc(100vw - 32px));background:#fff8df;border:5px solid #6d4725;border-radius:16px;padding:18px;box-shadow:0 14px 0 #3e2b1a,0 22px 45px rgba(0,0,0,.35)}.modal h3{margin:0 0 5px;color:#70431f}.modal p{margin:5px 0 14px;color:#5c684e}.choices{display:grid;gap:9px}.choice{border:3px solid #87602e;border-radius:10px;padding:11px;background:#f7e5a7;text-align:left;font-weight:700;color:#50351f;box-shadow:0 3px #87602e}.choice:hover{background:#ffefb9}.close{float:right;border:0;background:transparent;font-size:22px;color:#76502e}@media(max-width:760px){body{overflow:auto}.hud{display:none}main{grid-template-columns:1fr;grid-template-rows:minmax(450px,64vh) auto}.world-wrap{justify-content:flex-start;align-items:flex-start;padding:16px}aside{border-left:0;border-top:4px solid #8a6132;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.panel{margin:0}.panel:last-child{grid-column:span 2}footer{position:sticky;bottom:0;flex-wrap:wrap}.prompt{position:fixed;bottom:60px}}
  </style>
</head>
<body>
  <div class="app"><header><div class="brand"><div class="logo">🌱</div><div><b>小山谷</b><small>自由移动 · HTML 交互原型</small></div></div><div class="hud"><div class="chip">☀️ <strong>春 2 日</strong> · 上午 9:20</div><div class="chip">🪙 120</div><div class="bag"><div class="slot active">🌱<small id="seed-count">3</small></div><div class="slot">🥕<small id="produce-count">0</small></div><div class="slot">🪨<small id="stone-count">0</small></div></div></div></header>
  <main><section class="world-wrap" aria-label="俯视网格世界"><div class="world" id="world"></div><div class="prompt" id="prompt"><span class="key">E</span>在农田上互动</div></section><aside><div class="panel"><h2>当前位置</h2><p id="position">农场 · 土地 (6, 6)</p><div class="legend"><span><i class="swatch" style="background:#78ad49"></i>草地</span><span><i class="swatch" style="background:#bd7433"></i>农田</span><span><i class="swatch" style="background:#5ca5c7"></i>水域</span><span><i class="swatch" style="background:#dcb45c"></i>道路</span></div></div><div class="panel"><h2>附近互动</h2><p id="nearby">站进农田即可耕种。</p><div class="actions"><button class="action gold" data-open>按 E 互动</button><button class="action" id="reset">重置农田</button></div></div><div class="panel"><h2>最近事件</h2><p class="toast" id="toast"><strong>提示：</strong>按住 WASD / 方向键自由移动；接近对象后按 E。</p></div></aside></main>
  <footer><span><b>键盘操作</b></span><span><span class="footer-key">WASD</span> / <span class="footer-key">↑↓←→</span> 按住自由移动</span><span><span class="footer-key">E</span> 互动</span><span><span class="footer-key">Esc</span> 关闭菜单</span></footer></div>
  <div class="modal-backdrop" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="menu-title"><button class="close" id="close" aria-label="关闭">×</button><h3 id="menu-title">农田互动</h3><p id="menu-note"></p><div class="choices" id="choices"></div></div></div>
  <script>
    const COLS=16, ROWS=10, TILE=60, SPEED=190;
    const world=document.querySelector('#world');
    const state={x:5.5*TILE,y:5.5*TILE,held:new Set(),lastTime:0,soil:new Map(),crops:new Map(),inventory:{seeds:3,produce:0,stone:0},target:{kind:'farm',key:'5,5'}};
    const terrain=Array.from({length:ROWS},(_,y)=>Array.from({length:COLS},(_,x)=>{if(x===0||x===15||y===0||y===9)return'water';if(x>=5&&x<=10&&y>=4&&y<=8)return'soil';if((x===3&&y>=1&&y<=8)||(y===3&&x>=1&&x<=14))return'path';return'grass'}));
    const objects={'2,2':'🏠','12,2':'🌳','13,3':'🧑‍🌾','4,7':'⛏️'};
    const player=document.createElement('div');player.className='player';player.title='玩家';player.textContent='🙂';world.append(player);
    const modal=document.querySelector('#modal'),choices=document.querySelector('#choices'),note=document.querySelector('#menu-note'),title=document.querySelector('#menu-title'),toast=document.querySelector('#toast');
    const keyFor=(x,y)=>`${x},${y}`; const tileAt=(x,y)=>({x:Math.floor(x/TILE),y:Math.floor(y/TILE)}); const center=(x,y)=>({x:(x+.5)*TILE,y:(y+.5)*TILE});
    function message(text){toast.innerHTML='<strong>行动回执：</strong>'+text}
    function updateInventory(){document.querySelector('#seed-count').textContent=state.inventory.seeds;document.querySelector('#produce-count').textContent=state.inventory.produce;document.querySelector('#stone-count').textContent=state.inventory.stone}
    function isWalkable(x,y){const p=tileAt(x,y);return p.x>=1&&p.x<=14&&p.y>=1&&p.y<=8&&terrain[p.y][p.x]!=='water'}
    function closestObject(){let answer=null;for(const [key,kind] of Object.entries(objects)){if(kind!=='🧑‍🌾'&&kind!=='⛏️')continue;const [x,y]=key.split(',').map(Number),c=center(x,y),d=Math.hypot(state.x-c.x,state.y-c.y);if(d<50&&(!answer||d<answer.d))answer={kind:kind==='🧑‍🌾'?'npc':'mine',key,x,y,d}}return answer}
    function currentTarget(){const t=tileAt(state.x,state.y),obj=closestObject();if(obj)return obj;if(terrain[t.y][t.x]==='soil')return{kind:'farm',key:keyFor(t.x,t.y),x:t.x,y:t.y};return{kind:'none'}}
    function draw(){
      [...world.querySelectorAll('.tile')].forEach(n=>n.remove());
      terrain.forEach((row,y)=>row.forEach((type,x)=>{const key=keyFor(x,y),tile=document.createElement('div');tile.className='tile '+type;const plot=state.soil.get(key);if(plot)tile.classList.add(plot);const obj=objects[key];if(obj){const o=document.createElement('span');o.className='object '+(obj==='🏠'?'house':obj==='🌳'?'tree':obj==='🧑‍🌾'?'npc':'crop');o.textContent=obj;tile.append(o)}const crop=state.crops.get(key);if(crop){const c=document.createElement('span');c.className='object crop';c.textContent=crop==='mature'?'🥕':'🌱';tile.append(c)}world.insertBefore(tile,player)}));
      player.style.left=`${state.x}px`;player.style.top=`${state.y}px`;updateInventory();state.target=currentTarget();const pos=document.querySelector('#position'),nearby=document.querySelector('#nearby'),prompt=document.querySelector('#prompt'),t=tileAt(state.x,state.y);
      if(state.target.kind==='farm'){const crop=state.crops.get(state.target.key);pos.textContent=`农场 · 土地 (${t.x+1}, ${t.y+1})`;nearby.textContent=crop==='mature'?'脚下的作物已成熟。':'你正站在一块可耕种的农田上。';prompt.innerHTML='<span class="key">E</span>农田互动'}
      else if(state.target.kind==='npc'){pos.textContent='小镇 · 梅尔镇长旁';nearby.textContent='梅尔镇长似乎想和你谈谈。';prompt.innerHTML='<span class="key">E</span>与镇长交谈'}
      else if(state.target.kind==='mine'){pos.textContent='林地 · 矿点旁';nearby.textContent='这里有一块可开采的石矿。';prompt.innerHTML='<span class="key">E</span>开采资源'}
      else{pos.textContent=`野外 · ${terrain[t.y][t.x]==='path'?'小路':'草地'} (${t.x+1}, ${t.y+1})`;nearby.textContent='继续探索，或进入农田、接近互动对象。';prompt.innerHTML='<span class="key">E</span>附近没有互动'}
    }
    function openMenu(){const target=currentTarget();state.target=target;if(target.kind==='none'){message('附近没有可互动的对象。');draw();return}choices.innerHTML='';modal.classList.add('open');const add=(label,fn)=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{fn();modal.classList.remove('open');draw()};choices.append(b)};
      if(target.kind==='farm'){const plot=state.soil.get(target.key),crop=state.crops.get(target.key);title.textContent='农田互动';if(crop==='mature'){note.textContent='萝卜已成熟。它会固定留在这块农田上，直到收获。';add('🥕 收获萝卜',()=>{state.crops.delete(target.key);state.soil.set(target.key,'tilled');state.inventory.produce+=1;message('收获成功：萝卜 ×1 已放入背包。')})}else if(crop==='growing'){note.textContent='作物正在生长。';add('💧 浇水并催熟',()=>{state.soil.set(target.key,'watered');state.crops.set(target.key,'mature');message('浇水完成：作物成熟了。')})}else if(!plot){note.textContent='这里的土壤尚未耕作。';add('🪓 耕地',()=>{state.soil.set(target.key,'tilled');message('耕地完成：这块土地可种植。')})}else{note.textContent=plot==='watered'?'湿润土地，适合播种。':'已耕土地，选择种子。';add('🌱 种下防风草种子',()=>{if(state.inventory.seeds<1){message('种子不足。');return}state.inventory.seeds-=1;state.crops.set(target.key,'growing');message('种植成功：防风草种子 ×1。')});add('💧 浇水',()=>{state.soil.set(target.key,'watered');message('浇水完成。')})}}
      else if(target.kind==='npc'){title.textContent='梅尔镇长';note.textContent='“欢迎来到小山谷。你的农场正等着你照料。”';add('💬 继续对话',()=>message('对话推进：获得了“春季农务”提示。'))}
      else{title.textContent='石矿';note.textContent='一处可采集的矿石节点。';add('⛏️ 开采石矿',()=>{state.inventory.stone+=1;message('采集成功：石头 ×1 已放入背包。')})}}
    function update(time){const dt=Math.min(.05,(time-state.lastTime)/1000||0);state.lastTime=time;let dx=(state.held.has('right')?1:0)-(state.held.has('left')?1:0),dy=(state.held.has('down')?1:0)-(state.held.has('up')?1:0);if(dx||dy){const len=Math.hypot(dx,dy);dx=dx/len*SPEED*dt;dy=dy/len*SPEED*dt;const nx=state.x+dx,ny=state.y+dy;if(isWalkable(nx,state.y))state.x=nx;if(isWalkable(state.x,ny))state.y=ny;draw()}requestAnimationFrame(update)}
    const directionFor=k=>({w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'})[k];document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),dir=directionFor(k);if(dir){e.preventDefault();state.held.add(dir)}else if(k==='e'&&!e.repeat)openMenu();else if(k==='escape')modal.classList.remove('open')});document.addEventListener('keyup',e=>{const dir=directionFor(e.key.toLowerCase());if(dir)state.held.delete(dir)});window.addEventListener('blur',()=>state.held.clear());document.querySelector('[data-open]').onclick=openMenu;document.querySelector('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.querySelector('#reset').onclick=()=>{state.soil.clear();state.crops.clear();message('农田状态已重置。');draw()};updateInventory();draw();requestAnimationFrame(update);
  </script>
</body>
</html>
