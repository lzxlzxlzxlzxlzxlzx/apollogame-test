<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>现场搜证</title>
    <style>
      :root { background: #101820; color: #f4eedf; font-family: system-ui, "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
      #status { position: fixed; z-index: 100; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: min(760px, calc(100vw - 24px));
        padding: 7px 12px; border: 1px solid #8b7652; border-radius: 6px; background: #101820e8; color: #f4eedf;
        font-size: 12px; line-height: 1.45; text-align: center; pointer-events: none; }
      #stage canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="现场搜证游戏画面"></div>
    <div id="status" role="status" aria-live="polite">正在连接 DokiWorld…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
